name: Self Major Tag

# Exists for one caller shape: a shim that lives inside a project template as
# a jinja source, where no dependabot configuration can reach the pin because
# dependabot matches manifests by filename. Those shims pin `@v1` and this
# moves it. Everything else pins an exact tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  move:
    name: Move the major tag to this release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Force the major tag onto this commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          if [ "$major" = "$TAG" ]; then
            echo "::error::$TAG is not a vX.Y.Z tag, so there is no major to move."
            exit 1
          fi
          # Lightweight, so no committer identity is needed. The checkout
          # step left credentials behind that `contents: write` can push with.
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "::notice::$major now points at $TAG."
