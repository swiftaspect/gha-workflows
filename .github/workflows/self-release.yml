name: Self Release

# Dogfoods the reusable release.yml against this very repo. The ref `./`
# resolves to the current commit — works for same-repo reusable workflow
# references.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      release-type: simple
    secrets: inherit
