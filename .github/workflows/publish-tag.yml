name: Reusable Publish-Tag

# Called by consumer repos' .github/workflows/publish-tag.yml shim:
#
#   jobs:
#     publish:
#       uses: swiftaspect/gha-workflows/.github/workflows/publish-tag.yml@v<version>
#       with:
#         publish: true
#         makefile-override-file: .github/.ci.override.mk
#       secrets: inherit

on:
  workflow_call:
    inputs:
      makefile-override-file:
        description: |
          Since we are leveraging Makefiles, and sometimes CI needs different
          variables, rather than trying to be fancy, we just explicitly set
          an expected variable from our Makefiles in the CI only environment.
          And since you can't distribute env settings to reusable workflows,
          we have to pass it through as an option because it might not always
          be the same file, or maybe someone has multiple.  Path is relative
          to the repository root directory, and defaults to our preference.
        type: string
        default: .github/ci.override.mk
      registry-container:
        description: |
          The Container registry to publish the tagged containerto. Defaults
          to GitHub Packages, variablized because its part of GHA workflow.
        type: string
        default: ghcr.io
      upload-release-assets:
        description: |
          When true, uploads artifacts (e.g., the `make build` tarball)
          to the GitHub Release via `gh release upload`. Archival copy; registry
          is the canonical artifact source.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate-tag:
    name: Validate tag trigger
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure ref is a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::This workflow must be run against a tag, not a branch. Got: ${{ github.ref }}"
          exit 1

  publish:
    needs: validate-tag
    runs-on: ubuntu-24.04
    env:
      CI_MAKE_OVERRIDES: ${{ inputs.makefile-override-file }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Login to GitHub Container Registry - not always necessary
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ inputs.registry-container }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run build(s)
        run: make build

      - name: Publish package(s)
        run: make publish

      - name: Upload artifact tarball to GitHub Release
        if: inputs.upload-release-assets
        run: gh release upload ${{ github.ref_name }} ./*.tgz
