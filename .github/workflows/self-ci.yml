name: Self CI

# This repo's own CI. We cannot call the reusable ci.yml from this same repo
# (it expects a Makefile with check/start/stop targets), so this is a
# bare actionlint run over the reusable workflow files themselves.

on:
  push:
    branches-ignore:
      - 'release-please*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint reusable workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 #v2.1.2
        with:
          files: ".github/workflows/*.yml"
