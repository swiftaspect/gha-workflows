name: Self CI

# This repo's own CI. We cannot call the reusable ci.yml from this same repo
# (it expects a Makefile with check/start/stop targets), so this is a
# bare actionlint run over the reusable workflow files themselves.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint reusable workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 #v2.2.0
        with:
          files: ".github/workflows/*.yml"
