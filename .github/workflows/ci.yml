name: Reusable CI

# Called by consumer repos' .github/workflows/ci.yml shim:
#
#   jobs:
#     ci:
#       uses: swiftaspect/gha-workflows/.github/workflows/ci.yml@v<version>
#       with:
#         check-prerelease-deps: true
#         makefile-override-file: .github/.ci.override.mk
#       secrets: inherit

on:
  workflow_call:
    inputs:
      check-prerelease-deps:
        description: |
          When true, fail if package.json references pre-release or dist-tag
          `@swiftaspect/*` packages, or if compose files reference branch-tagged
          `ghcr.io/swiftaspect/*` images. This is the PR gate — only enforced on
          PRs targeting main.
        type: boolean
        default: false
      compose-up-for-tests:
        description: |
          When true, `make start` runs before `make check` (and `make stop` runs
          after). Use for repos with integration tests that need the full
          compose dependency stack (db, opa, calas, etc.).
        type: boolean
        default: false
      makefile-override-file:
        description: |
          Since we are leveraging Makefiles, and sometimes CI needs different
          variables, rather than trying to be fancy, we just explicitly set
          an expected variable from our Makefiles in the CI only environment.
          And since you can't distribute env settings to reusable workflows,
          we have to pass it through as an option because it might not always
          be the same file, or maybe someone has multiple.  Path is relative
          to the repository root directory, and defaults to our preference.
        type: string
        default: .github/ci.override.mk
      publish-on-branch:
        description: |
          When true, after `make check` passes on a non-main branch, run
          `make publish` so the Makefile can publish a branch-tagged
          pre-release artifact (e.g., an npm dist-tag, a container tag). The
          Makefile owns the language-specific translation; this workflow only
          exposes GITHUB_REF_NAME, GITHUB_RUN_NUMBER, and GITHUB_TOKEN to it.
          Used by spiras (the shared library) so consumer repos can resolve
          `make sync-branch-deps` against matching branch builds.
        type: boolean
        default: false
      registry-container:
        description: |
          The Container registry to publish the tagged containerto. Defaults
          to GitHub Packages, variablized because its part of GHA workflow.
        type: string
        default: ghcr.io

permissions:
  checks: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      CI_MAKE_OVERRIDES: ${{ inputs.makefile-override-file }}
      CONTAINER_REGISTRY: ${{ inputs.registry-container }}
    steps:
      - name: Login to GitHub Container Registry - not always necessary
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Bring up compose stack
        if: inputs.compose-up-for-tests
        run: make start

      - name: Run check (lint + typecheck + test)
        env:
          CONTAINER_NETWORK: --network bridge
        run: make check

      - name: Tear down compose stack
        if: always() && inputs.compose-up-for-tests
        run: make stop

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  check-prerelease-deps:
    name: PR gate — no pre-release or branch-tag deps
    if: inputs.check-prerelease-deps && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      CI_MAKE_OVERRIDES: ${{ inputs.makefile-override-file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject non-semver @swiftaspect/* npm deps
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json; skipping npm dep gate"
            exit 0
          fi
          if grep -qE '"@swiftaspect/[^"]+":[[:space:]]*"[^"0-9^~*][^"]*"' package.json; then
            echo "::error::package.json contains a non-semver @swiftaspect/* dependency value (dist-tag or similar). Bump to a released semver range before merging to main."
            grep -nE '"@swiftaspect/[^"]+":[[:space:]]*"[^"0-9^~*][^"]*"' package.json
            exit 1
          fi
          if grep -qE '"@swiftaspect/[^"]+":[[:space:]]*"[^"]*-[a-zA-Z]' package.json; then
            echo "::error::package.json contains a pre-release @swiftaspect/* dependency value. Bump to a stable release before merging to main."
            grep -nE '"@swiftaspect/[^"]+":[[:space:]]*"[^"]*-[a-zA-Z]' package.json
            exit 1
          fi
          echo "No pre-release or dist-tag @swiftaspect/* deps found."

      - name: Reject branch-tagged ghcr.io/swiftaspect/* images in compose files
        run: |
          BAD=0
          for f in compose.yaml compose.defaults.yaml; do
            [ -f "$f" ] || continue
            # Extract each ghcr.io/swiftaspect/<repo>:<tag>, inspect the tag.
            # Valid tag shapes: v?<digit>.<digit>.<digit> (optionally with -<prerelease>.<n> but we reject those too on main).
            # Invalid on main: tags that start with a letter (branch slug) OR contain `-` (pre-release).
            while IFS= read -r ref; do
              tag="${ref##*:}"
              case "$tag" in
                v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*)
                  # Allowed: v1.2.3 or 1.2.3 — but NOT if it contains `-` (pre-release)
                  case "$tag" in
                    *-*)
                      echo "::error::$f references pre-release tag: $ref"
                      BAD=1
                      ;;
                  esac
                  ;;
                *)
                  echo "::error::$f references non-semver tag (likely a branch slug or 'latest'): $ref"
                  BAD=1
                  ;;
              esac
            done < <(grep -oE 'ghcr\.io/swiftaspect/[a-z0-9-]+:[^ "'"'"']+' "$f" || true)
          done
          exit $BAD

  publish-on-branch:
    name: Publish branch pre-release
    if: inputs.publish-on-branch && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    needs: [check]
    runs-on: ubuntu-latest
    env:
      CI_MAKE_OVERRIDES: ${{ inputs.makefile-override-file }}
      CONTAINER_REGISTRY: ${{ inputs.registry-container }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry - not always necessary
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish branch pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish
