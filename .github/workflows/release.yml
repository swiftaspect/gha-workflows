name: Reusable Release

# Called by consumer repos' .github/workflows/release.yml shim:
#
#   jobs:
#     release:
#       uses: swiftaspect/gha-workflows/.github/workflows/release.yml@v<version>
#       with:
#         release-type: node       # or "simple" for meta repos
#       secrets: inherit

on:
  workflow_call:
    inputs:
      release-type:
        description: |
          release-please release-type. App repos with a package.json use `node`;
          meta repos with no package version to bump use `simple`. No default —
          callers specify explicitly.
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SAGHAH_APP_ID }}
          private-key: ${{ secrets.SAGHAH_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --rebase ${{ fromJSON(steps.release.outputs.pr).number }}
